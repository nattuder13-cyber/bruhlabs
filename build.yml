name: Build MorphKick (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCOPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: MorphKick-Windows
          path: |
            build/MorphKick_artefacts/Release/VST3/MorphKick.vst3
            build/MorphKick_artefacts/Release/Standalone/MorphKick.exe
